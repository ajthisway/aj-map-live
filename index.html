<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AJ's Live GPS Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .mapboxgl-popup-content {
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYWp0aGlzd2F5IiwiYSI6ImNtOHZlZmc2YTB2OTEybnI1ZGcyemtsbmoifQ.g2z2Lp2Ko0SsAnV7BdYyYg';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v11',
    center: [0, 0],
    zoom: 2
  });

  Promise.all([
    fetch('https://raw.githubusercontent.com/ajthisway/aj-map-live/main/locations_archive.json').then(res => res.json()),
    fetch('https://raw.githubusercontent.com/ajthisway/aj-map-live/main/locations.json').then(res => res.json())
  ])
  .then(([archiveData, liveData]) => {
    const data = [...archiveData, ...liveData];

    if (!data || data.length === 0) return;

    const coords = data.map(p => [parseFloat(p.lon), parseFloat(p.lat)]);

    data.forEach(point => {
      const coord = [parseFloat(point.lon), parseFloat(point.lat)];
      const date = new Date(isNaN(point.timestamp) ? point.timestamp : point.timestamp * 1000);
      const label = date.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

      const popupHTML = `
        <div style="font-family: sans-serif; padding-right: 10px; max-width: 180px;">
          <strong>AJ's Location</strong><br/>
          ${label}
        </div>
      `;

      new mapboxgl.Marker({ color: "#e74c3c" })
        .setLngLat(coord)
        .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupHTML))
        .addTo(map);
    });

    map.on('load', () => {
      map.addSource('route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: coords
          }
        }
      });

      map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        layout: {
          'line-join': 'round',
          'line-cap': 'round'
        },
        paint: {
          'line-color': '#ff0000',
          'line-width': 4
        }
      });

      const lastCoord = coords[coords.length - 1];
      map.jumpTo({
        center: lastCoord,
        zoom: 13
      });
    });
  });
</script>
</body>
</html>
