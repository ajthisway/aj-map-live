<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AJ's Real-Time GPS Tracker</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1IjoiYWp0aGlzd2F5IiwiYSI6ImNtOHZlZmc2YTB2OTEybnI1ZGcyemtsbmoifQ.g2z2Lp2Ko0SsAnV7BdYyYg';
  
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v11',
    center: [0, 0],
    zoom: 2
  });

  fetch('https://raw.githubusercontent.com/ajthisway/aj-map-live/main/locations.json')
    .then(res => res.json())
    .then(data => {
      const coords = data.map(p => [parseFloat(p.lon), parseFloat(p.lat)]);
      
      if (coords.length === 0) return;

      coords.forEach(coord => {
        new mapboxgl.Marker().setLngLat(coord).addTo(map);
      });

      if (coords.length > 1) {
        map.addSource('route', {
          type: 'geojson',
          data: {
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: coords
            }
          }
        });

        map.addLayer({
          id: 'route',
          type: 'line',
          source: 'route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#ff0000', 'line-width': 3 }
        });

        map.fitBounds(coords.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(coords[0], coords[0])), {
          padding: 50
        });
      } else {
        map.setCenter(coords[0]);
        map.setZoom(12);
      }
    });
</script>
</body>
</html>
